[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stat-arb-pairs-trading"
version = "0.1.0"
description = "A research platform for walk-forward statistical-arbitrage pairs trading."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0,<2",
  "fastapi>=0.115,<1",
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "plotly>=5.18,<7",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
  "seaborn>=0.13,<1",
  "statsmodels>=0.14,<1",
  "uvicorn>=0.30,<1",
  "yfinance>=0.2.40,<1",
]

[project.optional-dependencies]
dashboard = [
  "streamlit>=1.32,<2",
]
notebook = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.1,<5",
]
dev = [
  "coverage[toml]>=7.4,<8",
  "httpx>=0.27,<1",
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pairs_trading*"]

[tool.setuptools.package-data]
pairs_trading = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["pairs_trading"]

[tool.coverage.report]
show_missing = true
skip_covered = true
